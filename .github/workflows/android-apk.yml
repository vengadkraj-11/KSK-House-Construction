name: Build KSK Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
      EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}

    steps:
      - name: Checkout project
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Check Firebase app configuration
        run: |
          test -n "$EXPO_PUBLIC_FIREBASE_API_KEY" || { echo "::error::Missing FIREBASE_API_KEY"; exit 1; }
          test -n "$EXPO_PUBLIC_FIREBASE_PROJECT_ID" || { echo "::error::Missing FIREBASE_PROJECT_ID"; exit 1; }
          test -n "$EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID" || { echo "::error::Missing FIREBASE_MESSAGING_SENDER_ID"; exit 1; }
          test -n "$EXPO_PUBLIC_FIREBASE_APP_ID" || { echo "::error::Missing FIREBASE_APP_ID"; exit 1; }
          python3 - <<'PY'
          import json
          import os
          import sys

          expected_project = "ksk-house-construction"
          expected_package = "com.ksk.houseconstruction"
          configured_project = os.environ["EXPO_PUBLIC_FIREBASE_PROJECT_ID"]
          with open("google-services.json", encoding="utf-8") as config_file:
              google_config = json.load(config_file)
          with open(".firebaserc", encoding="utf-8") as config_file:
              firebase_cli_config = json.load(config_file)
          with open("app.json", encoding="utf-8") as config_file:
              expo_config = json.load(config_file)
          google_project = google_config.get("project_info", {}).get("project_id")
          default_project = firebase_cli_config.get("projects", {}).get("default")
          app_package = expo_config.get("expo", {}).get("android", {}).get("package")
          packages = {
              client.get("client_info", {}).get("android_client_info", {}).get("package_name")
              for client in google_config.get("client", [])
          }
          if configured_project != expected_project:
              sys.exit("::error::FIREBASE_PROJECT_ID must target the expected KSK Firebase project.")
          if google_project != configured_project:
              sys.exit("::error::FIREBASE_PROJECT_ID does not match google-services.json project_info.project_id.")
          if default_project != configured_project:
              sys.exit("::error::FIREBASE_PROJECT_ID does not match .firebaserc default project.")
          if app_package != expected_package:
              sys.exit("::error::app.json Android package does not match the expected KSK package.")
          if expected_package not in packages:
              sys.exit("::error::google-services.json does not contain the expected Android package.")
          print("Firebase project and Android package configuration validated.")
          PY

      - name: Generate Android project
        run: CI=1 npx expo prebuild --platform android --no-install

      - name: Build APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KSK-House-Construction-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
