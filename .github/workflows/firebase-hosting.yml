name: Deploy KSK team website
run-name: Deploy ${{ github.ref_name }} at ${{ github.sha }}

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
      EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: yarn install --non-interactive
      - name: Validate Firebase configuration
        run: |
          test -n "$EXPO_PUBLIC_FIREBASE_API_KEY" || { echo "::error::Missing FIREBASE_API_KEY"; exit 1; }
          test -n "$EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN" || { echo "::error::Missing FIREBASE_AUTH_DOMAIN"; exit 1; }
          test -n "$EXPO_PUBLIC_FIREBASE_PROJECT_ID" || { echo "::error::Missing FIREBASE_PROJECT_ID"; exit 1; }
          test -n "$EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID" || { echo "::error::Missing FIREBASE_MESSAGING_SENDER_ID"; exit 1; }
          test -n "$EXPO_PUBLIC_FIREBASE_APP_ID" || { echo "::error::Missing FIREBASE_APP_ID"; exit 1; }
          test "$EXPO_PUBLIC_FIREBASE_PROJECT_ID" = "ksk-house-construction" || { echo "::error::Wrong Firebase project"; exit 1; }
      - name: Type check
        run: yarn typecheck
      - name: Run tests
        run: yarn test
      - name: Run Firestore rules tests
        run: npx --yes firebase-tools emulators:exec --only firestore,auth --project demo-ksk "node --test tests/firestoreRules.test.cjs tests/authFlow.test.cjs"
      - name: Deploy Firestore rules
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KSK_HOUSE_CONSTRUCTION }}
        run: |
          credential_file="$RUNNER_TEMP/firebase-service-account.json"
          trap 'rm -f "$credential_file"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$credential_file"
          GOOGLE_APPLICATION_CREDENTIALS="$credential_file" npx --yes firebase-tools deploy --only firestore:rules --project ksk-house-construction
      - name: Export website
        run: npm run build:web
      - name: Verify exported family portal and hosting target
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const config = JSON.parse(fs.readFileSync('firebase.json', 'utf8'));
          if (config.hosting?.site !== 'ksk-house-construction' || config.hosting?.public !== 'dist') {
            throw new Error('Firebase Hosting must publish dist to the ksk-house-construction site.');
          }
          const html = fs.readFileSync(path.join(config.hosting.public, 'index.html'), 'utf8');
          const entry = html.match(/src=["']([^"']+\.js)["']/)?.[1];
          if (!entry) throw new Error('The production HTML does not reference an Expo web bundle.');
          const bundlePath = path.join(config.hosting.public, entry.replace(/^\/+/, ''));
          if (!fs.existsSync(bundlePath)) throw new Error(`The referenced web bundle is missing: ${bundlePath}`);
          const bundle = fs.readFileSync(bundlePath, 'utf8');
          for (const required of ['Sign In', 'Sign Up', 'Owner Login', 'Add Member', 'Viewer access management']) {
            if (!bundle.includes(required)) throw new Error(`The production bundle is missing the expected feature: ${required}`);
          }
          console.log(`Verified ${bundlePath} includes the current family portal and owner management.`);
          NODE
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KSK_HOUSE_CONSTRUCTION }}
          projectId: ksk-house-construction
          channelId: live
